[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.37"
# Monad execution semantics (requires Foundry >= 1.8.0).
network = "monad"
# Match the live networks: Monad docs list testnet and mainnet at revision MONAD_NINE,
# while local execution would otherwise default to MonadTen.
hardfork = "monad:MonadNine"
# Tests read the fixtures generated by packages/core (read-only).
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[invariant]
# 128 runs x 200 calls keeps `pnpm check` fast; raise for deeper local runs.
runs = 128
depth = 200
# The handler only makes calls it expects to succeed, and checks expected failures with
# vm.expectRevert, so any unexpected revert is a real failure.
fail_on_revert = true

[lint]
# Input validation loops revert on the first bad element by design (all-or-nothing checks).
exclude_lints = ["require-revert-in-loop"]

[fmt]
line_length = 100

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
