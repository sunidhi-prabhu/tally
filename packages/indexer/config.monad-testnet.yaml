# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
#
# Monad testnet (chain 10143). Defaults are the verified deployment recorded in
# packages/contracts/deployments/monad-testnet.json (tx 0x8caf5d1b…23f4, block 69887060);
# ENVIO_TALLY_LEDGER_ADDRESS / ENVIO_TALLY_LEDGER_START_BLOCK override them. Envio Cloud uses the
# defaults, so no dashboard variables are needed. Locally, data comes from HyperSync, which
# requires ENVIO_API_TOKEN.
#
#   ENVIO_CONFIG=config.monad-testnet.yaml pnpm envio dev
name: tally-indexer
description: Tally ledger indexer (Monad testnet)
address_format: lowercase
disable_default_cross_chain: true
rollback_on_reorg: true
# Every handler records the transaction hash.
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: TallyLedger
    abi_file_path: ./abis/TallyLedger.json
    events:
      - event: GroupCreated
      - event: MemberAdded
      - event: MemberRemoved
      - event: ExpenseRecorded
      - event: SettlementRecorded
      - event: TokenSettled
chains:
  - id: 10143
    start_block: ${ENVIO_TALLY_LEDGER_START_BLOCK:-69887060}
    contracts:
      - name: TallyLedger
        address: "${ENVIO_TALLY_LEDGER_ADDRESS:-0x07d6ec522de5119eea1bdb6aba5de879cfec6bb5}"
